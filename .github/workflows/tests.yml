name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        exclude:
          # Laravel 13 requires PHP ^8.3 (illuminate/console, illuminate/support,
          # pestphp/pest, and pestphp/pest-plugin-laravel all require it) — this
          # combination can never resolve, so it's excluded rather than left to
          # fail loudly in CI.
          - php: '8.2'
            laravel: '13.*'
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Select Laravel/Testbench versions
        run: |
          composer require "illuminate/console:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-update --dev

      - name: Install dependencies
        run: |
          # Laravel 11.x has no patched release for CVE-2026-48019 (CRLF
          # injection in the default email validation rule, GHSA-5vg9-
          # 5847-vvmq) — the fix ships only in 12.60.0+/13.10.0+. This
          # matrix leg installs Laravel 11 solely to test TicoScope's own
          # compatibility with that framework version, so --no-blocking
          # (a command-scoped flag, never written to composer.json) is
          # applied ONLY when matrix.laravel == '11.*' below — never a
          # blanket override, and never part of the published package's
          # own composer.json/security policy. `composer audit` (below)
          # keeps the advisory visible regardless.
          composer update --prefer-dist --no-interaction ${{ matrix.laravel == '11.*' && '--no-blocking' || '' }}

      - name: composer validate
        run: composer validate --strict

      - name: composer audit (non-blocking, informational)
        continue-on-error: true
        run: composer audit

      - name: Run tests
        run: vendor/bin/pest

  prefer-lowest:
    name: PHP 8.2 / Laravel (prefer-lowest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies (lowest supported versions)
        run: |
          # --prefer-lowest resolves toward composer.json's declared floor
          # (Laravel 11.0.0), which is exactly what this job exists to
          # test. Laravel 11.x has no patched release for CVE-2026-48019
          # (CRLF injection in the default email validation rule, GHSA-
          # 5vg9-5847-vvmq — fix ships only in 12.60.0+/13.10.0+): without
          # --no-blocking, Composer's advisory-aware solver excludes the
          # entire 11.x line and silently resolves this job to Laravel 12
          # instead, defeating its actual purpose rather than merely
          # failing loudly. `composer audit` (below) keeps the advisory
          # visible regardless.
          composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-blocking

      - name: composer validate
        run: composer validate --strict

      - name: composer audit (non-blocking, informational)
        continue-on-error: true
        run: composer audit

      - name: Run tests
        run: vendor/bin/pest
